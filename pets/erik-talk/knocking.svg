<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Loupi · 敲打 Knocking"><title>Loupi · 敲打 Knocking</title><desc>Loupi 的 敲打 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-tap 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
