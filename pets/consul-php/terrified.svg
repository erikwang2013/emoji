<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Consu · 惊恐 Terrified"><title>Consu · 惊恐 Terrified</title><desc>Consu 的 惊恐 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-tremble 0.18s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
