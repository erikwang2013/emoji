<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 280 250" width="280" height="250" role="img" aria-label="哈希迪 Hashy · 捂脸 Facepalm"><title>哈希迪 Hashy · 捂脸 Facepalm</title><desc>哈希迪 Hashy 的 捂脸 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-headshake 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
