<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 280 250" width="280" height="250" role="img" aria-label="哈希迪 Hashy · 惊恐 Terrified"><title>哈希迪 Hashy · 惊恐 Terrified</title><desc>哈希迪 Hashy 的 惊恐 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-tremble 0.18s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
