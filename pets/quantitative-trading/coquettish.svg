  项目宠物「犇犇」表情形态 · 撒娇

  共用同一副身体与五官骨架，只替换眼睛、眉毛、嘴与情绪特效。
  动效遵循 prefers-reduced-motion。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="88" height="88" role="img" aria-label="犇犇 · 撒娇 Coquettish">
  <title>犇犇 · 撒娇 Coquettish</title>
  <desc>犇犇 的 撒娇 表情形态 · animated expression form</desc>
  <style>
.ex-motion { transform-box: fill-box; transform-origin: 50% 100%; animation: ex-sway 2.6s ease-in-out infinite; }
.ex-anim-tear, .ex-anim-sweat, .ex-anim-heart, .ex-anim-spark, .ex-anim-rain,
.ex-anim-confetti, .ex-anim-pulse, .ex-anim-knock, .ex-anim-knockline,
.ex-anim-palm, .ex-anim-steam, .ex-anim-shock, .ex-anim-please, .ex-anim-drift {
  transform-box: fill-box; transform-origin: center;
}
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; }
.ex-anim-sweat { animation: ex-tear 1.5s ease-in infinite; }
.ex-anim-heart { animation: ex-heart 2.2s ease-out infinite; }
.ex-anim-spark { animation: ex-spark 1.9s ease-in-out infinite; }
.ex-anim-rain { animation: ex-rain 1.4s linear infinite; }
.ex-anim-confetti { animation: ex-confetti 2.4s linear infinite; }
.ex-anim-pulse { animation: ex-pulse 1.6s ease-in-out infinite; }
.ex-anim-knockline { animation: ex-knockline 0.55s ease-out infinite; }
.ex-anim-steam { animation: ex-steam 1.8s ease-out infinite; }
.ex-anim-shock { animation: ex-shock 0.5s ease-in-out infinite; }
.ex-anim-please { animation: ex-please 1.4s ease-in-out infinite; }
.ex-anim-drift { animation: ex-drift 4.5s ease-in-out infinite; }
@keyframes ex-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4.33px); } }
@keyframes ex-bounce { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-7.35px); } 55% { transform: translateY(-2.16px); } 75% { transform: translateY(0); } }
@keyframes ex-slump { 0%,100% { transform: translateY(3px); } 50% { transform: translateY(0); } }
@keyframes ex-tremble { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
@keyframes ex-sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.43px); } }
@keyframes ex-knock { 0%,100% { transform: translateX(6.08px); } 35% { transform: translateX(0); } }
@keyframes ex-palm { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1.62px) rotate(-4deg); } }
@keyframes ex-tear { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 1; } 100% { transform: translateY(14.87px); opacity: 0; } }
@keyframes ex-heart { 0% { transform: translateY(0) scale(.65); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-24.34px) scale(1.15); opacity: 0; } }
@keyframes ex-spark { 0%,100% { transform: scale(.6) rotate(0deg); opacity: .3; } 50% { transform: scale(1.15) rotate(25deg); opacity: 1; } }
@keyframes ex-rain { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(16.22px); opacity: 0; } }
@keyframes ex-confetti { 0% { transform: translateY(-4.73px) rotate(0deg); opacity: 1; } 100% { transform: translateY(21.63px) rotate(200deg); opacity: 0; } }
@keyframes ex-pulse { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.18); opacity: .7; } }
@keyframes ex-knockline { 0%,100% { transform: scaleX(.6); opacity: .35; } 35% { transform: scaleX(1); opacity: 1; } }
@keyframes ex-steam { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-12.17px); opacity: 0; } }
@keyframes ex-shock { 0%,100% { transform: scaleX(.7); opacity: .4; } 50% { transform: scaleX(1.25); opacity: 1; } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.43px); } }
@keyframes ex-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.7px); } }
@media (prefers-reduced-motion: reduce) { .ex-motion, [class*="ex-anim-"] { animation: none !important; } }
</style>
  <g class="ex-motion ex-coquettish">
  <ellipse cx="160" cy="292" rx="92" ry="9" fill="#1E2A33" opacity="0.08"/>
  <!-- 尾巴：一根上扬的行情线 -->
  <path d="M 218,244 L 246,232 L 254,240 L 274,214" fill="none" stroke="#D9A441" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 263,219 L 276,210 L 277,225 Z" fill="#D9A441"/>
  <!-- 腿与蹄 -->
  <rect x="126" y="250" width="28" height="32" rx="14" fill="#1E2A33"/>
  <rect x="166" y="250" width="28" height="32" rx="14" fill="#1E2A33"/>
  <rect x="123" y="272" width="34" height="17" rx="8.5" fill="#D9A441"/>
  <rect x="163" y="272" width="34" height="17" rx="8.5" fill="#D9A441"/>
  <!-- 身体 -->
  <path d="M 160,168 C 122,168 100,194 100,224 C 100,252 126,268 160,268 C 194,268 220,252 220,224 C 220,194 198,168 160,168 Z" fill="#1E2A33"/>
  <ellipse cx="160" cy="230" rx="40" ry="31" fill="#2B3945"/>
  <!-- 手臂：右手抬起打招呼 -->
  <path d="M 108,196 C 94,208 86,222 84,234" fill="none" stroke="#1E2A33" stroke-width="20" stroke-linecap="round"/>
  <circle cx="82" cy="240" r="13" fill="#D9A441"/>
  <path d="M 212,196 C 228,190 240,178 246,168" fill="none" stroke="#1E2A33" stroke-width="20" stroke-linecap="round"/>
  <circle cx="250" cy="162" r="13" fill="#D9A441"/>
  <!-- 耳朵 -->
  <ellipse cx="70" cy="122" rx="30" ry="17" transform="rotate(-20 70 122)" fill="#1E2A33"/>
  <ellipse cx="72" cy="122" rx="16" ry="8" transform="rotate(-20 72 122)" fill="#D9A441"/>
  <ellipse cx="250" cy="122" rx="30" ry="17" transform="rotate(20 250 122)" fill="#1E2A33"/>
  <ellipse cx="248" cy="122" rx="16" ry="8" transform="rotate(20 248 122)" fill="#D9A441"/>

  <!-- 牛角 -->
  <path d="M 112,68 C 101,57 97,44 101,32" fill="none" stroke="#D9A441" stroke-width="13" stroke-linecap="round"/>
  <path d="M 208,68 C 219,57 223,44 219,32" fill="none" stroke="#D9A441" stroke-width="13" stroke-linecap="round"/>
  <!-- 头 -->
  <path d="M 160,58 C 105,58 74,86 74,124 C 74,160 106,184 160,184 C 214,184 246,160 246,124 C 246,86 215,58 160,58 Z" fill="#1E2A33"/>

  <!-- 呆毛：一根小阳线 -->
  <path d="M 160,16 V 62" stroke="#1E2A33" stroke-width="4" stroke-linecap="round"/>
  <rect x="152" y="30" width="16" height="24" rx="3" fill="#C7472F"/>
  <ellipse cx="120" cy="107" rx="21" ry="24" fill="#FFF6E8"/>
  <path d="M 120,122 C 107,112 109,99 120,106 C 131,99 133,112 120,122 Z" fill="#C7472F"/>
  <path d="M 181,110 Q 200,96 219,110" fill="none" stroke="#FFF6E8" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 101,76 Q 118,66 135,76" fill="none" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
  <path d="M 185,80 Q 202,74 219,80" fill="none" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
  <!-- 口鼻 -->
  <ellipse cx="160" cy="152" rx="50" ry="25" fill="#D9A441"/>
  <ellipse cx="144" cy="147" rx="5" ry="7" fill="#1E2A33"/>
  <ellipse cx="176" cy="147" rx="5" ry="7" fill="#1E2A33"/>
  <path d="M 152,163 Q 160,169 168,163" fill="none" stroke="#1E2A33" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 156,163 Q 160,160 164,163" fill="none" stroke="#1E2A33" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="96" cy="140" rx="15" ry="9" fill="#E88C7D" opacity="0.55"/>
  <ellipse cx="224" cy="140" rx="15" ry="9" fill="#E88C7D" opacity="0.55"/>
  <!-- 算珠项链 -->
  <path d="M 116,190 Q 160,218 204,190" fill="none" stroke="#C7472F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="160" cy="214" r="17" fill="#D9A441"/>
  <rect x="152" y="206" width="16" height="16" fill="#1E2A33"/>

  <path class="ex-anim-heart" style="animation-delay:0s" d="M 72,76.75 C 63,70.9 64.35,62.8 72,68.2 C 79.65,62.8 81,70.9 72,76.75 Z" fill="#C7472F"/>
  <path class="ex-anim-heart" style="animation-delay:.55s" d="M 252,67.25 C 245,62.7 246.05,56.4 252,60.6 C 257.95,56.4 259,62.7 252,67.25 Z" fill="#C7472F"/>
  <path class="ex-anim-heart" style="animation-delay:1.1s" d="M 266,184.0 C 258,178.8 259.2,171.6 266,176.4 C 272.8,171.6 274,178.8 266,184.0 Z" fill="#C7472F"/>
  <path class="ex-anim-spark" style="animation-delay:.3s" d="M 56,150 L 57.68,154.32 L 62,156 L 57.68,157.68 L 56,162 L 54.32,157.68 L 50,156 L 54.32,154.32 Z" fill="#D9A441"/>
  </g>
</svg>
