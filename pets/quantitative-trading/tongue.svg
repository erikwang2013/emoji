<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="算子 · 吐舌头 Tongue Out"><title>算子 · 吐舌头 Tongue Out</title><desc>算子 的 吐舌头 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sway 2.0s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
