<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="算子 · 哭 Cry"><title>算子 · 哭 Cry</title><desc>算子 的 哭 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sob 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
