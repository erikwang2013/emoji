  </g></g><g class="ex-face"><circle cx="56" cy="111" r="20" fill="url(#cream)"/><circle cx="136" cy="111" r="20" fill="url(#cream)"/><ellipse cx="96" cy="118" rx="15" ry="9" fill="url(#body)"/><path d="M 37,116.6 Q 56,88 75,116.6" fill="none" stroke="#0B6E82" stroke-width="4" stroke-linecap="round"/><path d="M 117,116.6 Q 136,88 155,116.6" fill="none" stroke="#0B6E82" stroke-width="4" stroke-linecap="round"/><path d="M 73,118.4 Q 96,155.12 119,118.4 Z" fill="#4A1D2E" stroke="#0B6E82" stroke-width="2.56"/><ellipse cx="96" cy="129.92" rx="10.12" ry="7.92" fill="#FF6B8A"/><ellipse class="ex-anim-pulse" cx="41" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.6"/><ellipse class="ex-anim-pulse" cx="151" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.6"/><g transform="translate(154.95 112.72)"><circle class="ex-anim-confetti" style="animation-delay:0.0s" r="3.93" fill="#FF6B9D"/></g><g transform="translate(139.7 138.22)"><rect class="ex-anim-confetti" style="animation-delay:0.16s" x="-2.81" y="-5.61" width="5.61" height="11.22" rx="1.68" fill="#FFD166"/></g><g transform="translate(97.19 148.28)"><circle class="ex-anim-confetti" style="animation-delay:0.32s" r="3.93" fill="#4FA3FF"/></g><g transform="translate(60.44 139.06)"><rect class="ex-anim-confetti" style="animation-delay:0.48s" x="-2.81" y="-5.61" width="5.61" height="11.22" rx="1.68" fill="#5FBF9F"/></g><g transform="translate(26.97 114.08)"><circle class="ex-anim-confetti" style="animation-delay:0.64s" r="3.93" fill="#9B7BFF"/></g><g transform="translate(15.61 82.88)"><rect class="ex-anim-confetti" style="animation-delay:0.8s" x="-2.81" y="-5.61" width="5.61" height="11.22" rx="1.68" fill="#F97316"/></g><g transform="translate(59.02 57.38)"><circle class="ex-anim-confetti" style="animation-delay:0.96s" r="3.93" fill="#FF6B9D"/></g><g transform="translate(94.97 47.32)"><rect class="ex-anim-confetti" style="animation-delay:1.12s" x="-2.81" y="-5.61" width="5.61" height="11.22" rx="1.68" fill="#FFD166"/>