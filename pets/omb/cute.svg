    </linearGradient>
    <linearGradient id="mustard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD470"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0B6E82" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0B6E82" stop-opacity="0"/>
