        <circle cx="170.5" cy="50" r="1.8" fill="#FFFFFF" opacity="0.75"/>
      </g>
    </g>
  </g></g><g class="ex-face"><circle cx="56" cy="111" r="20" fill="url(#cream)"/><circle cx="136" cy="111" r="20" fill="url(#cream)"/><ellipse cx="96" cy="118" rx="15" ry="9" fill="url(#body)"/><ellipse cx="56" cy="111" rx="20" ry="22.8" fill="#FFFFFF" stroke="#0B6E82" stroke-width="3.2"/><ellipse cx="56" cy="111" rx="11.6" ry="14.59" fill="#0B6E82"/><circle cx="51.6" cy="104.62" r="4" fill="#FFFFFF"/><circle cx="60.8" cy="117.84" r="2" fill="#FFFFFF" opacity=".9"/><ellipse cx="136" cy="111" rx="20" ry="22.8" fill="#FFFFFF" stroke="#0B6E82" stroke-width="3.2"/><ellipse cx="136" cy="111" rx="11.6" ry="14.59" fill="#0B6E82"/><circle cx="131.6" cy="104.62" r="4" fill="#FFFFFF"/><circle cx="140.8" cy="117.84" r="2" fill="#FFFFFF" opacity=".9"/><path d="M 82.2,122 Q 96,137.84 109.8,122" fill="none" stroke="#0B6E82" stroke-width="3.2" stroke-linecap="round"/><ellipse class="ex-anim-pulse" cx="41" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.65"/><ellipse class="ex-anim-pulse" cx="151" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.65"/><path class="ex-anim-spark" style="animation-delay:0.0s" d="M 22.08,46.2 L 25.44,54.84 L 34.08,58.2 L 25.44,61.56 L 22.08,70.2 L 18.72,61.56 L 10.08,58.2 L 18.72,54.84 Z" fill="#FFC93C"/><path class="ex-anim-spark" style="animation-delay:0.4s" d="M 167.28,32.36 L 170.08,39.56 L 177.28,42.36 L 170.08,45.16 L 167.28,52.36 L 164.48,45.16 L 157.28,42.36 L 164.48,39.56 Z" fill="#FFC93C"/><path class="ex-anim-spark" style="animation-delay:0.8s" d="M 175.2,88.36 L 177.1,93.26 L 182,95.16 L 177.1,97.06 L 175.2,101.96 L 173.3,97.06 L 168.4,95.16 L 173.3,93.26 Z" fill="#FFC93C"/></g></g></svg>