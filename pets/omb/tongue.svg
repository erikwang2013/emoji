    </g>
  </g></g><g class="ex-face"><circle cx="56" cy="111" r="20" fill="url(#cream)"/><circle cx="136" cy="111" r="20" fill="url(#cream)"/><ellipse cx="96" cy="118" rx="15" ry="9" fill="url(#body)"/><ellipse cx="56" cy="111" rx="20" ry="22.8" fill="#FFFFFF" stroke="#0B6E82" stroke-width="3.2"/><ellipse cx="56" cy="111" rx="9.6" ry="12.54" fill="#0B6E82"/><circle cx="51.6" cy="104.62" r="4" fill="#FFFFFF"/><path d="M 117,116.6 Q 136,88 155,116.6" fill="none" stroke="#0B6E82" stroke-width="4" stroke-linecap="round"/><path d="M 73,118.4 Q 96,152.24 119,118.4 Z" fill="#4A1D2E" stroke="#0B6E82" stroke-width="2.56"/><path d="M 88.18,129.92 Q 96,156.56 103.82,129.92 Z" fill="#FF5C8A" stroke="#0B6E82" stroke-width="1.44"/><path d="M 96,132.08 L 96,145.04" stroke="#0B6E82" stroke-width="1.12" opacity=".55"/><ellipse cx="41" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.55"/><ellipse cx="151" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.55"/><path class="ex-anim-spark" style="animation-delay:0.2s" d="M 27.36,50.2 L 29.6,55.96 L 35.36,58.2 L 29.6,60.44 L 27.36,66.2 L 25.12,60.44 L 19.36,58.2 L 25.12,55.96 Z" fill="#FF5C8A"/></g></g></svg>