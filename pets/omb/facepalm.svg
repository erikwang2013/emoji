    </g>
  </g></g><g class="ex-face"><circle cx="56" cy="111" r="20" fill="url(#cream)"/><circle cx="136" cy="111" r="20" fill="url(#cream)"/><ellipse cx="96" cy="118" rx="15" ry="9" fill="url(#body)"/><path d="M 37,107 Q 56,133 75,107" fill="none" stroke="#0B6E82" stroke-width="4" stroke-linecap="round"/><path d="M 73,122 Q 78.75,101.84 84.5,107.6 Q 90.25,101.84 96,122 Q 101.75,142.16 107.5,136.4 Q 113.25,142.16 119,122" fill="none" stroke="#0B6E82" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="41" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.7"/><ellipse cx="151" cy="138" rx="15.6" ry="8.4" fill="#FF8FB3" opacity="0.7"/><g transform="translate(139 114) rotate(12)"><rect class="ex-anim-palm" x="-17.25" y="-24.15" width="34.5" height="46" rx="12.65" fill="#F4633A" stroke="#B33A18" stroke-width="2.07"/><path class="ex-anim-palm" d="M -8.28,-17.25 L -8.28,-2.3" stroke="#B33A18" stroke-width="1.26" stroke-linecap="round" opacity=".55"/><path class="ex-anim-palm" d="M 0,-17.25 L 0,-2.3" stroke="#B33A18" stroke-width="1.26" stroke-linecap="round" opacity=".55"/><path class="ex-anim-palm" d="M 8.28,-17.25 L 8.28,-2.3" stroke="#B33A18" stroke-width="1.26" stroke-linecap="round" opacity=".55"/></g><g transform="translate(37.2 47.64)"><circle class="ex-anim-steam" style="animation-delay:0.0s" r="6.6" fill="#D7DEE8" opacity=".72"/></g><g transform="translate(43.2 43.44)"><circle class="ex-anim-steam" style="animation-delay:0.28s" r="8.4" fill="#D7DEE8" opacity=".72"/></g><g transform="translate(49.2 48.24)"><circle class="ex-anim-steam" style="animation-delay:0.56s" r="6" fill="#D7DEE8" opacity=".72"/></g><g transform="translate(0 0)"><path class="ex-anim-sweat" style="animation-delay:0.2s" d="M 165,81 C 171,90.6 171,99.4 165,99.4 C 159,99.4 159,90.6 165,81 Z" fill="#6FB2F0"/><circle cx="165" cy="90.2" r="1.76" fill="#FFFFFF" opacity=".8"/></g></g></g></svg>