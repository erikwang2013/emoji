<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ClickHouse 小象 · 敲打 Knocking"><title>ClickHouse 小象 · 敲打 Knocking</title><desc>ClickHouse 小象 的 敲打 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-tap 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-sweat { animation: ex-tear 1.5s ease-in infinite; transform-box: fill-box; transform-origin: center; }
