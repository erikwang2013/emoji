<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ClickHouse 小象 · 惊恐 Terrified"><title>ClickHouse 小象 · 惊恐 Terrified</title><desc>ClickHouse 小象 的 惊恐 表情形态 · animated expression form</desc><style>
