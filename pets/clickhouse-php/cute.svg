<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ClickHouse 小象 · 卖萌 Cute"><title>ClickHouse 小象 · 卖萌 Cute</title><desc>ClickHouse 小象 的 卖萌 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-hop 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
