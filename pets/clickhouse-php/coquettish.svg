<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ClickHouse 小象 · 撒娇 Coquettish"><title>ClickHouse 小象 · 撒娇 Coquettish</title><desc>ClickHouse 小象 的 撒娇 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sway 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
